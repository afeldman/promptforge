[project]
name = "promptforge"
version = "1.0.0"
description = "PromptForge Python AI layer: LLM-Provider-Abstraktion und LLM-gestützte Architect/Optimize/Verify-Passes"
requires-python = ">=3.11"
dependencies = [
    "any-llm-sdk>=1.26.0",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

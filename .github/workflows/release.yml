# PromptForge — GitHub Release Automation Workflow
#
# Automatisch GitHub Release aus Git Tag vMAJOR.MINOR.PATCH erzeugen
# nach erfolgreicher CI-Validierung via ci.yml

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read  # Erforderlich für GitHub Actions API Zugriffe auf CI-Runs

jobs:
  # --- Haupt-Release-Gate (deterministisch, Blocking) ---
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # --- CI-GATE: Der Tag-Commit muss CI-bestanden haben (Robustes Polling) ---
      - name: Check CI Status for Release Gate (with polling and timeout)
        id: ci-status
        run: |
          set -euo pipefail
          
          echo "=== Checking CI Status for Release Gate ==="
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ci.yml"
          echo ""
          
          TAG="${{ github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          
          MAX_ATTEMPTS=60        # Max 10 Minuten (20s * 60)
          ATTEMPT=1
          SLEEP_INTERVAL=20       # Sekunden zwischen Polling-Runden
          
          # GitHub Token für API-Zugriffe (standardmäßig von github bereitgestellt)
          GH_TOKEN="${{ github.token }}"
          echo "Using GH_TOKEN from github.token"
          
          # Funktion: CI-Run für diesen Commit finden
          find_ci_run() {
            local response
            local run_id
            
            response=$(GH_TOKEN="$GH_TOKEN" curl -s \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/runs?event=push&per_page=100" 2>/dev/null) || return 1
            
            run_id=$(echo "$response" | jq -r --arg sha "$COMMIT_SHA" \
              '.[] | select(.head_sha == $sha and .name != null)' \
              '.id // empty' 2>/dev/null) || return 1
            
            if [ -n "$run_id" ]; then
              echo "$run_id"
              return 0
            fi
            return 1
          }
          
          # Funktion: CI-Run Conclusion holen
          get_run_conclusion() {
            local run_id="$1"
            
            if [ -z "$run_id" ]; then
              echo ""
              return 1
            fi
            
            curl -s \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$run_id" \
              | jq -r '.conclusion // empty' 2>/dev/null || echo ""
          }
          
          # Funktion: CI-Run Status holen
          get_run_status() {
            local run_id="$1"
            
            if [ -z "$run_id" ]; then
              echo "not_found"
              return 1
            fi
            
            curl -s \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$run_id" \
              | jq -r '.status // empty' 2>/dev/null || echo "unknown"
          }
          
          # Polling-Loop
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "---"
            echo "CI Gate Check — Attempt: $ATTEMPT/$MAX_ATTEMPTS"
            
            CI_RUN=$(find_ci_run) || {
              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo ""
                echo "❌ CI GATE TIMEOUT: No successful ci.yml run found for commit $COMMIT_SHA within ${MAX_ATTEMPTS} attempts"
                echo "CI runs may not have finished yet or CI workflow has issues."
                exit 1
              else
                echo "⚠️ CI run for this commit not found yet — waiting ${SLEEP_INTERVAL}s (Race Condition? Push triggered both workflows simultaneously?)"
                echo ""
                ATTEMPT=$((ATTEMPT + 1))
                sleep $SLEEP_INTERVAL
                continue
              fi
            }
            
            echo "CI run found:"
            echo "  ID: $CI_RUN"
            
            # Run-Details holen (Status kann sich ändern)
            RUN_STATUS=$(get_run_status "$CI_RUN")
            CI_CONCLUSION=$(get_run_conclusion "$CI_RUN")
            
            echo "  Status: $RUN_STATUS"
            echo "  Conclusion: $CI_CONCLUSION"
            
            # URLs für Diagnostics
            RUN_URL="https://github.com/${REPO}/actions/runs/${CI_RUN}"
            echo "  URL: $RUN_URL"
            
            case "$CI_CONCLUSION" in
              "success")
                echo ""
                echo "✅ CI GATE: PASS"
                echo "   workflow: ci.yml"
                echo "   commit: $COMMIT_SHA"
                echo "   run: $CI_RUN"
                echo "   conclusion: success"
                echo ""
                echo "Release gate opened — proceeding with release creation."
                
                echo "CI_CONCLUSION=success" >> $GITHUB_OUTPUT
                echo "CI_RUN_ID=$CI_RUN" >> $GITHUB_OUTPUT
                echo "CI_RUN_URL=$RUN_URL" >> $GITHUB_OUTPUT
                ;;
              
              "failure"|"cancelled"|"timed_out")
                echo ""
                echo "❌ CI GATE: FAIL"
                echo "   workflow: ci.yml"
                echo "   commit: $COMMIT_SHA"
                echo "   run: $CI_RUN"
                echo "   conclusion: $CI_CONCLUSION"
                echo ""
                echo "Releases can only be created after successful CI validation."
                exit 1
                ;;
              
              "skipped"|"neutral")
                echo ""
                echo "⚠️ CI GATE: SKIPPED/NEUTRAL"
                echo "   workflow: ci.yml"
                echo "   commit: $COMMIT_SHA"
                echo "   run: $CI_RUN"
                echo "   conclusion: $CI_CONCLUSION"
                echo ""
                
                # Skipped ist ok für macOS-only Jobs, aber wir prüfen den Job-Status genauer
                JOB_STATUS=$(echo "$response" | jq -r --arg run_id "$CI_RUN" \
                  '.[] | select(.id == ($run_id | tonumber)) | .jobs["ci"]?.conclusion // empty' 2>/dev/null) || {
                  # Wenn jobs Feld nicht existiert, wir akzeptieren "skipped" als ok für cross-platform releases
                  echo "⚠️ Could not determine specific job status — proceeding cautiously"
                }
                
                if [ "$JOB_STATUS" = "success" ]; then
                  echo "✅ Linux CI job succeeded — release gate opened"
                  echo "CI_CONCLUSION=success" >> $GITHUB_OUTPUT
                elif [ "$JOB_STATUS" = "skipped" ] || [ -z "$JOB_STATUS" ]; then
                  echo "⚠️ No Linux CI run found or skipped — skipping release (cross-platform requirement)"
                  exit 0  # Kein Release, aber auch kein Fehler
                else
                  echo "❌ CI job failed: $JOB_STATUS"
                  exit 1
                fi
                ;;
              
              "")
                if [ "$RUN_STATUS" = "completed" ]; then
                  # Run completed aber conclusion ist leer — etwas seltsam, behandeln wie failure
                  echo ""
                  echo "⚠️ CI run completed but no conclusion available — treating as failure for safety"
                  exit 1
                else
                  # In progress/queued/waiting — weiter warten (handled in next iteration)
                  echo "⚠️ Run status: $RUN_STATUS — waiting for completion"
                  echo ""
                  ATTEMPT=$((ATTEMPT + 1))
                  sleep $SLEEP_INTERVAL
                  continue
                fi
                ;;
              
              *)
                echo ""
                echo "⚠️ Unknown CI conclusion: $CI_CONCLUSION (status: $RUN_STATUS)"
                echo "This may indicate an API inconsistency or race condition."
                ATTEMPT=$((ATTEMPT + 1))
                sleep $SLEEP_INTERVAL
                continue
                ;;
            esac
          done

      # --- Version Extract (wird erst nach CI-Gate ausgeführt) ---
      - name: Extract Tag Version
        if: steps.ci-status.outputs.CI_CONCLUSION == 'success'
        id: tag-version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          
          echo "Extracted version from tag: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      # --- Version Consistency Check (FAIL bei Mismatch) ---
      - name: Validate Version Consistency (MISMATCH = FAIL)
        if: steps.ci-status.outputs.CI_CONCLUSION == 'success'
        id: version-validation
        run: |
          TAG="${{ github.ref_name }}"
          VERSION_TAG="${TAG#v}"
          
          # Cargo Workspace Version aus Root Cargo.toml
          CARGO_VERSION=$(grep -E '^version\s*=\s*"' Cargo.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/') || {
            echo "⚠️ Could not read Cargo version from Cargo.toml"
          }
          
          echo "Tag version: $VERSION_TAG"
          echo "Cargo workspace version: $CARGO_VERSION"
          
          if [ "$VERSION_TAG" != "$CARGO_VERSION" ]; then
            echo ""
            echo "❌ VERSION MISMATCH DETECTED!"
            echo "   Tag:      $VERSION_TAG"
            echo "   Cargo:     $CARGO_VERSION"
            echo ""
            echo "A release can only be created when the Git tag version matches the Cargo package version."
            echo "This prevents releasing production code with incorrect version numbers."
            echo ""
            echo "Note: Automatic version synchronization is intentionally disabled to prevent:"
            echo "  - Accidental commits during release process"
            echo "  - Breaking changes to production code"
            exit 1
          else
            echo "✅ Version consistency verified"
          fi
      
      # --- Duplicate Check (Release existiert schon?) ---
      - name: Check if Release Already Exists
        if: steps.ci-status.outputs.CI_CONCLUSION == 'success'
        id: release-check
        run: |
          TAG="${{ github.ref_name }}"
          
          RELEASE_EXISTS=$(GH_TOKEN="$GH_TOKEN" curl -s \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' 2>/dev/null || echo "")
          
          if [ -n "$RELEASE_EXISTS" ]; then
            echo "⚠️ Release already exists for tag: $TAG (ID: $RELEASE_EXISTS)"
            echo "SKIP_REASON=release_already_exists" >> $GITHUB_OUTPUT
          else
            echo "✅ No existing release found for this tag"
            echo "RELEASING=true" >> $GITHUB_OUTPUT
            echo "SKIP_REASON=" >> $GITHUB_OUTPUT
          fi
      
      # --- Create GitHub Release (nur wenn CI=success, Version matcht, und Release existiert nicht) ---
      - name: Create GitHub Release
        if: steps.ci-status.outputs.CI_CONCLUSION == 'success' && steps.version-validation.result == 'success' && steps.release-check.outputs.RELEASING == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: PromptForge v${{ github.ref_name }}
          body: |
            ## Release Notes
            
            This release includes changes since the previous version.
            
            ### Highlights
            
            - Continuous integration and testing improvements
            - Python/PyO3 build infrastructure updates
          draft: false
          prerelease: false
          generate_release_notes: true

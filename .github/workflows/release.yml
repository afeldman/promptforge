# PromptForge — Release (tag push)
#
# Fires on a pushed version tag (vMAJOR.MINOR.PATCH[-pre]) and runs the full
# release pipeline. On success it publishes the GitHub release with the built
# binaries and checksums.
#
# All logic lives in release-pipeline.yml (reused by release-manual.yml too).

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Release pipeline
    uses: ./.github/workflows/release-pipeline.yml
    permissions:
      contents: write
    with:
      checkout_ref: ${{ github.ref }}
      release_tag: ${{ github.ref_name }}
      publish: true

# PromptForge — GitHub Release Automation Workflow
#
# Automatisch GitHub Release aus Git Tag vMAJOR.MINOR.PATCH erzeugen
# nach erfolgreicher Release-Pipeline-Validierung

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+-**'

env:
  # Use GitHub-provided token for all API calls
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate Tag Format
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      tag_name: ${{ steps.extract-version.outputs.tag_name }}
      is_pre_release: ${{ steps.extract-version.outputs.is_pre_release }}
    
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Extract version from git tag
        id: extract-version
        run: |
          TAG="${{ github.ref_name }}"
          # Remove 'v' prefix
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          
          # Check for pre-release indicators
          if [[ "$TAG" =~ -[a-zA-Z] ]]; then
            echo "is_pre_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_pre_release=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Display extracted version info
        run: |
          echo "=== Tag Validation ==="
          echo "Tag: ${{ github.ref_name }}"
          echo "Version: ${{ steps.extract-version.outputs.version }}"
          echo "Pre-Release: ${{ steps.extract-version.outputs.is_pre_release }}"

  validate-consistency:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    needs: validate-tag
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Get Cargo workspace version via metadata (canonical)
        id: cargo-version
        run: |
          # Use cargo metadata for canonical Workspace version from pf-core (the root crate)
          # This avoids grep picking up multiple version fields from workspace.dependencies
          CARGO_VERSION=$(cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.name == "pf-core") | .version')
          
          echo "cargo_version=$CARGO_VERSION" >> $GITHUB_OUTPUT
          echo "Cargo workspace version (from pf-core): $CARGO_VERSION"
      
      - name: Validate Cargo workspace version format
        run: |
          # Ensure we have exactly ONE version string, not multiple lines
          CARGO_VERSION="${{ steps.cargo-version.outputs.cargo_version }}"
          
          line_count=$(echo "$CARGO_VERSION" | wc -l)
          echo "Cargo version line count: $line_count"
          
          if [ "$line_count" -ne 1 ]; then
            echo "ERROR: Cargo version contains multiple lines!" >&2
            echo "Version string:" >&2
            echo "$CARGO_VERSION" | cat -A >&2
            exit 1
          fi
          
          # Validate semver format
          if ! [[ "$CARGO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: Cargo version '$CARGO_VERSION' does not match semver format X.Y.Z" >&2
            exit 1
          fi
          
          echo "✓ Cargo version is valid and single-line: $CARGO_VERSION"
      
      - name: Get Python requirement from pyproject.toml
        id: python-version
        run: |
          # Extract requires-python using Python for reliability
          PYTHON_REQUIRE=$(python3 -c "import tomli; import sys; print(sys.argv[1].get('requires-python', '>=3.8').strip())" python/pyproject.toml 2>/dev/null || grep -oP 'requires-python\s*=\s*"[^"]+"' python/pyproject.toml | sed 's/.*"\([^"]*\)"/\1/')
          echo "python_require=$PYTHON_REQUIRE" >> $GITHUB_OUTPUT
          echo "Python requirement: $PYTHON_REQUIRE"

  validate-python-uv-pyo3:
    name: Python/uv/PyO3 Setup
    runs-on: ubuntu-latest
    needs: validate-consistency
    env:
      GH_TOKEN: ${{ github.token }}
      # CRITICAL: Use absolute path, never relative paths for PyO3
      PYO3_PYTHON: ${{ github.workspace }}/python/.venv/bin/python
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Verify uv is available
        run: |
          uv --version
      
      - name: Sync Python environment with uv
        run: |
          cd python
          uv sync --frozen
          cd ..
      
      - name: Verify Python binary exists (CRITICAL for PyO3)
        run: |
          PY_BIN="${{ github.workspace }}/python/.venv/bin/python"
          echo "=== Checking Python Binary ==="
          echo "Path: $PY_BIN"
          
          if [ ! -x "$PY_BIN" ]; then
            echo "FATAL: Python binary does not exist or is not executable" >&2
            echo "This will break PyO3 compilation" >&2
            exit 1
          fi
          echo "✓ Python binary exists and is executable"
      
      - name: Verify Python version
        run: |
          PY_BIN="${{ github.workspace }}/python/.venv/bin/python"
          $PY_BIN --version
      
      - name: Verify Python can import sys
        run: |
          PY_BIN="${{ github.workspace }}/python/.venv/bin/python"
          $PY_BIN -c "import sys; print('Executable:', sys.executable); print('Version:', sys.version)"

  validate-format-clippy:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    needs: validate-python-uv-pyo3
    env:
      GH_TOKEN: ${{ github.token }}
      PYO3_PYTHON: ${{ github.workspace }}/python/.venv/bin/python
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Run cargo fmt --check
        run: |
          cargo fmt --all -- --check || {
            echo "cargo fmt check failed" >&2
            exit 1
          }
      
      - name: Run cargo clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings

  validate-rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: validate-format-clippy
    env:
      GH_TOKEN: ${{ github.token }}
      PYO3_PYTHON: ${{ github.workspace }}/python/.venv/bin/python
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Run cargo test
        run: |
          cargo test --workspace

  validate-python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: validate-rust-tests
    env:
      GH_TOKEN: ${{ github.token }}
      PYO3_PYTHON: ${{ github.workspace }}/python/.venv/bin/python
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Run Python pytest
        working-directory: python
        run: |
          uv run pytest

  build-release:
    name: Release Build & Validation
    runs-on: ubuntu-latest
    needs: [validate-python-tests, validate-format-clippy]
    env:
      GH_TOKEN: ${{ github.token }}
      PYO3_PYTHON: ${{ github.workspace }}/python/.venv/bin/python
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run cargo build --release
        run: |
          cargo build --release || {
            echo "cargo build --release failed" >&2
            exit 1
          }
      
      - name: Verify release binary exists
        run: |
          BIN="${{ github.workspace }}/target/release/prompt-forge"
          if [ ! -x "$BIN" ]; then
            echo "FATAL: Release binary does not exist: $BIN" >&2
            exit 1
          fi
          echo "✓ Release binary exists: $BIN"
      
      - name: Verify Cargo workspace version matches Tag version
        run: |
          TAG_VERSION="${{ steps.extract-version.outputs.version }}"
          
          # Get Cargo workspace version from pf-core (canonical)
          CARGO_VERSION=$(cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.name == "pf-core") | .version')
          
          echo "Tag version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "FATAL: Version mismatch!" >&2
            echo "Tag version ($TAG_VERSION) must match Cargo workspace version ($CARGO_VERSION)" >&2
            echo "Do NOT modify Cargo.toml automatically. Manual bump required." >&2
            exit 1
          fi
          
          echo "✓ Tag version matches Cargo workspace version: $CARGO_VERSION"

  compiler-smoke-test:
    name: Compiler Smoke Test
    runs-on: ubuntu-latest
    needs: build-release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Run compiler smoke test
        run: |
          ./tests/compiler-smoke.sh

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: compiler-smoke-test
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Run cargo audit (if available)
        run: |
          if command -v cargo-audit &> /dev/null; then
            cargo audit
          else
            echo "cargo-audit not installed, skipping security audit"
          fi

  multi-platform-builds:
    name: Multi-Platform Builds
    needs: [validate-python-tests, validate-format-clippy]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: "prompt-forge-${{ github.ref_name }}-x86_64-unknown-linux-gnu"
            archive_ext: "tar.gz"
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: "prompt-forge-${{ github.ref_name }}-x86_64-apple-darwin"
            archive_ext: "tar.gz"
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: "prompt-forge-${{ github.ref_name }}-aarch64-apple-darwin"
            archive_ext: "tar.gz"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: "prompt-forge-${{ github.ref_name }}-x86_64-pc-windows-msvc"
            archive_ext: "zip"
    
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYO3_PYTHON: ${{ github.workspace }}/python/.venv/bin/python
    
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Set cargo target
        run: |
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target-${{ matrix.target }}" >> $GITHUB_ENV
      
      - name: Cross-compile for ${{ matrix.target }}
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Archive release artifact
        shell: bash
        run: |
          TARGET_DIR="${{ github.workspace }}/target/${{ matrix.target }}/release"
          OUTPUT_FILE="${{ github.workspace }}/releases/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}"
          
          mkdir -p releases
          
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Windows: create zip with binary only
            cp "${TARGET_DIR}/prompt-forge.exe" "$OUTPUT_FILE"
          else
            # Unix: create tar.gz with binary
            tar -czf "${OUTPUT_FILE}" -C "$(dirname ${TARGET_DIR})" "$(basename ${TARGET_DIR})/prompt-forge"
          fi
      
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          path: |
            ${{ github.workspace }}/releases/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: fail

  create-sha256sums:
    name: Generate SHA256 Sum File
    needs: multi-platform-builds
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: releases
          merge-multiple: true
      
      - name: Generate SHA256 Sum file
        run: |
          cd releases
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
          
          # Verify checksums
          sha256sum -c SHA256SUMS

  upload-sha256sums:
    name: Upload SHA256 Sum File to Release
    needs: create-sha256sums
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: releases
          merge-multiple: true
      
      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: releases/SHA256SUMS

  create-github-release:
    name: Create GitHub Release
    needs: [upload-sha256sums, validate-tag]
    if: ${{ needs.validate-tag.outputs.is_pre_release == 'false' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Download all artifacts for release
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: releases
          merge-multiple: true
      
      - name: Create GitHub Release
        run: |
          VERSION="${{ github.ref_name }}"
          
          # Use gh CLI to create release
          gh release create "$VERSION" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PromptForge $VERSION" \
            --generate-notes \
            -F releases/SHA256SUMS \
            --notes "$(echo '## PromptForge Release Notes\n\nThis is an automated release from tag $VERSION.')" \
            || {
              # Check if release already exists (duplicate)
              echo "Release may already exist for this tag"
              exit 0
            }

  create-github-pre-release:
    name: Create GitHub Pre-Release
    needs: [upload-sha256sums, validate-tag]
    if: ${{ needs.validate-tag.outputs.is_pre_release == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Download all artifacts for release
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: releases
          merge-multiple: true
      
      - name: Create GitHub Pre-Release
        run: |
          VERSION="${{ github.ref_name }}"
          
          # Use gh CLI to create pre-release
          gh release create "$VERSION" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PromptForge $VERSION (Pre-Release)" \
            --generate-notes \
            -F releases/SHA256SUMS \
            --prerelease \
            --notes "$(echo '## PromptForge Pre-Release Notes\n\nThis is an automated pre-release from tag $VERSION.')" \
            || {
              # Check if release already exists (duplicate)
              echo "Pre-release may already exist for this tag"
              exit 0
            }

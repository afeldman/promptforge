# PromptForge — Release (manual)
#
# Manually dispatch the full release pipeline against any ref for diagnostics
# or to cut a release without pushing a tag first.
#
#   dry_run = true  (default)  -> validate + audit + build only, no release
#   dry_run = false            -> also publish the GitHub release for release_tag
#
# All logic lives in release-pipeline.yml (shared with release.yml).

name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to validate and build.
        required: true
        default: master
        type: string
      release_tag:
        description: Version tag (vMAJOR.MINOR.PATCH[-pre]). Used for artifact names, version checks and — unless dry-run — the release.
        required: true
        default: v1.0.0
        type: string
      dry_run:
        description: Validate and build only — do not create a GitHub release.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Release pipeline
    uses: ./.github/workflows/release-pipeline.yml
    permissions:
      contents: write
    with:
      checkout_ref: ${{ inputs.ref }}
      release_tag: ${{ inputs.release_tag }}
      publish: ${{ !inputs.dry_run }}
